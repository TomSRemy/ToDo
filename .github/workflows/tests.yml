name: Tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.63.0 openpyxl
      - run: python -m playwright install --with-deps chromium
      - run: python tests/smoke_test.py
      - run: python tests/mail_accuracy.py --all --min 0.95
      - run: python tests/extraction_accuracy.py --all --min 0.95
      - run: python tests/bridge_test.py   # PowerShell is preinstalled on the runner
