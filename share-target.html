<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajout rapide</title>
<style>
  :root{ --bg:#0A0D12; --panel:#0F131A; --bd:#242B36; --tx1:#EAEAEA; --tx3:#6B7480; --accent:#4DA3FF; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--tx1); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; display:flex; align-items:center; justify-content:center; }
  .box{ text-align:center; padding:24px; max-width:320px; }
  .icon{ width:40px; height:40px; margin:0 auto 14px; }
  h1{ font-size:15px; font-weight:600; margin:0 0 6px; }
  p{ font-size:12.5px; color:var(--tx3); margin:0; }
  .check{ display:none; }
  .spinner{ width:22px; height:22px; border:2.5px solid var(--bd); border-top-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="msg">Ajout de la tâche…</h1>
    <p id="sub">Retour à l'appli dans un instant</p>
  </div>

<script src="js/share-target.js"></script>
</body>
</html>
