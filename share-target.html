<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajout rapide</title>
<style>
  :root{ --bg:#0A0D12; --panel:#0F131A; --bd:#242B36; --tx1:#EAEAEA; --tx3:#6B7480; --accent:#4DA3FF; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--tx1); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; display:flex; align-items:center; justify-content:center; }
  .box{ text-align:center; padding:24px; max-width:320px; }
  .icon{ width:40px; height:40px; margin:0 auto 14px; }
  h1{ font-size:15px; font-weight:600; margin:0 0 6px; }
  p{ font-size:12.5px; color:var(--tx3); margin:0; }
  .check{ display:none; }
  .spinner{ width:22px; height:22px; border:2.5px solid var(--bd); border-top-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="msg">Ajout de la tâche…</h1>
    <p id="sub">Retour à l'appli dans un instant</p>
  </div>

<script>
  if(!window.storage){
    window.storage = {
      async get(key){ try{ const v=localStorage.getItem('todo_'+key); return v!==null?{key,value:v,shared:false}:null; }catch(e){ return null; } },
      async set(key,value){ try{ localStorage.setItem('todo_'+key,value); return {key,value,shared:false}; }catch(e){ return null; } }
    };
  }

  (async function(){
    const params = new URLSearchParams(location.search);
    const sharedTitle = (params.get('title') || '').trim();
    const sharedText = (params.get('text') || '').trim();
    const sharedUrl = (params.get('url') || '').trim();

    // Best-effort title: prefer the share's title, fall back to the first line of text, else a generic label
    let title = sharedTitle || (sharedText.split('\n')[0] || '').slice(0, 120) || 'Tâche depuis partage';
    let description = sharedText && sharedText !== title ? sharedText : '';
    let link = sharedUrl;
    // If a URL got shared inside the text body instead of the url param, keep it as link too
    if(!link){
      const m = sharedText.match(/https?:\/\/\S+/);
      if(m) link = m[0];
    }

    const TASKS_KEY = 'todo-widget-tasks';
    let tasks = [];
    try{ const r = await window.storage.get(TASKS_KEY, false); tasks = r && r.value ? JSON.parse(r.value) : []; }catch(e){}

    tasks.push({
      id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      title: title,
      description: description,
      client: '', project: '',
      urgency: 'moyenne', status: 'a_faire',
      due: '', reminder: '', link: link,
      recur: null, subtasks: [],
      archived: false, archivedAt: null,
      createdAt: Date.now()
    });

    try{ await window.storage.set(TASKS_KEY, JSON.stringify(tasks), false); }catch(e){}

    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'Tâche ajoutée ✓';
    document.getElementById('sub').textContent = title;
    setTimeout(()=>{ location.href = 'index.html'; }, 900);
  })();
</script>
</body>
</html>
