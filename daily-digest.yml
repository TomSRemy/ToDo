name: Daily task digest email

on:
  schedule:
    # 7h and 8h UTC = 9h Paris in summer (CEST) and winter (CET) respectively.
    # The script itself checks the real Paris-local hour and only sends once.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send daily digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: tom.remy@selfee.fr
        run: python scripts/send_daily_digest.py
